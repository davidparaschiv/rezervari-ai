<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fă o programare — Rezervări AI</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; font: 17px/1.6 system-ui, sans-serif; color: #17171b; background: #faf7f7; }
    main { width: min(100%, 480px); padding: 28px; border-radius: 20px; background: white; overflow-wrap: anywhere; }
    h1 { font-size: 26px; line-height: 1.3; }
    a { color: #ad1732; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Fă o programare</h1>
    <p>Acest link deschide programarea în aplicația Rezervări AI instalată pe telefon.</p>
    <p>Dacă nu ai aplicația, instaleaz-o, apoi scanează din nou codul QR al firmei.</p>
    <a href="/">Rezervări AI</a>
  </main>
  <script>
    const name = new URLSearchParams(location.search).get('nume');
    if (name) document.getElementById('title').textContent = 'Fă o programare - ' + name;
  </script>
</body>
</html>
